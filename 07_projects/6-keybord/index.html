<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body{
        background-color: #2c2c2c;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .project{
        width: 100%;
        display: flex;
        justify-content: center;
    }

    .key{
        font-size: 28px;
        font-weight: bold;
        text-align: center;
    }

    .color{
        display: flex;
        justify-content: center;
        align-items: center;
    }

    table{
        border-collapse: collapse;
        width: 600px;
        background-color: #1f1f1f;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    th{
        background-color: #4CAF50;
        color: white;
        padding: 15px;
        font-size: 20px;
        text-transform: uppercase;
    }

    td{
        padding: 15px;
        text-align: center;
        font-size: 18px;
        border: 1px solid #555;
    }

    tr:nth-child(even){
        background-color: #333;
    }

    tr:hover{
        background-color: #444;
        transition: 0.3s;
    }
</style>
</head>
<body style="background-color: grey; color: white;">
    <div class="project">
        <div id="insert">
            <div class="key">press the key and watch magic</div>
        </div>
    </div>
</body>
<script src="anshu.js"></script>
</html>
